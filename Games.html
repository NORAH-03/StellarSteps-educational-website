<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Games - Stellar Steps</title>

        <!-- Norah Ballash Alhajri 441200195 -->

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(to bottom, #0b0c2a, #050618);
            color: white;
            text-align: center;
        }

        /* Navbar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 40px;
            background: rgba(18, 20, 74, 0.8);
        }

        .navbar h1 {
            color: #00d4ff;
        }

        .navbar a {
            color: #ddd;
            text-decoration: none;
            margin-left: 25px;
        }

        .navbar a:hover {
            color: #00d4ff;
        }

        /* Hero Section */
        .hero {
            padding: 100px 20px 60px;
        }

        .hero h2 {
            font-size: 40px;
            margin-bottom: 30px;
        }

        .hero p {
            font-size: 18px;
            color: #bbb;
            max-width: 600px;
            margin: auto;
        }

        /* Game Buttons */
        .buttons {
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
            padding: 60px 20px;
        }

        .btn {
            padding: 20px 40px;
            background: linear-gradient(45deg, #00d4ff, #4facfe);
            color: black;
            font-size: 18px;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn:hover {
            transform: scale(1.05);
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 20px;
            background: rgba(18, 20, 74, 0.8);
            color: #aaa;
        }

    </style>
</head>
<body>

    <!-- Navbar -->
    <div class="navbar">
        <h1>Stellar Steps</h1>
        <div>
            <a href="HomePage.html">Home</a>
            <a href="Planets.html">Planets</a>
            <a href="Games.html">Games</a>
            <a href="AboutUsPage.html">About us</a>
        </div>
    </div>

    <!-- Hero Section -->
    <div class="hero">
        <h2>Choose Your Game 🚀</h2>
        <p>Select one of the exciting games below and put your space knowledge to the test!</p>
    </div>

    <!-- Game Buttons -->
    <div class="buttons">
        <a href="Matching.html" class="btn">Matching Game</a>
        <a href="moon_phases.html" class="btn">Moon Phases Game</a>
    </div>

    <!-- Footer -->
    <div class="footer">
        <p>© 2026 Stellar Steps | Made with 🚀</p>
    </div>

</body>
</html>
