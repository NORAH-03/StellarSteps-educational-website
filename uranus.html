<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Uranus</title>

<!-- GHADEER AL HAMOUD 441200016 -->

<style>
body{
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(to bottom, #0b0c2a, #050618);
    color: white;
    display: flex;
    flex-direction: column;
    align-items: center;
}

/* Title */
h1{
    margin-top: 40px;
    font-size: 40px;
    color: #00d4ff;
}

/* Main */
.main{
    text-align: center;
    padding: 40px;
}

/* Image */
.planet-cont{
    margin: 30px 0;
}

img{
    width: 180px;
    height: 180px;
    border-radius: 50%;
    box-shadow: 0 0 25px rgba(0,212,255,0.4);
}

/* Info */
.info{
    padding: 25px;
    border-radius: 15px;
    width: 300px;
    margin: auto;
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.1);
}

p{
    margin: 10px 0;
    font-size: 15px;
    color: #ccc;
}

/* Button */
.btn{
    margin-top: 30px;
    padding: 12px 25px;
    border-radius: 25px;
    border: none;
    font-weight: bold;
    cursor: pointer;
    background: linear-gradient(45deg, #00d4ff, #4facfe);
    color: black;
    transition: 0.3s;
}

.btn:hover{
    transform: scale(1.05);
}
</style>

</head>

<body>

<h1>Uranus 🌀</h1>

<div class="main">

    <!-- Planet Image -->
    <div class="planet-cont">
        <img src="https://upload.wikimedia.org/wikipedia/commons/3/3d/Uranus2.jpg" alt="Uranus">
    </div>

    <!-- Info -->
    <div class="info">
        <p>🌞 Distance from Sun: 2.9 billion km</p>
        <p>⏰ Day Length: 17 hours</p>
        <p>🌡️ Average Temp: -224°C</p>
        <p>🌀 Rotates on its side!</p>
    </div>

    <!-- Button -->
    <button class="btn" onclick="goBack()">Back to Solar System</button>

</div>

<script>
function goBack() {
  window.location.href = "Planets.html";}
</script>

</body>
</html>
